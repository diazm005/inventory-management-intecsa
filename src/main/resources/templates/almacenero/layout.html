<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE | Inventario">Almacenero</title>
    <link rel="icon" th:href="@{/img/favicon.ico}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/almacenero.css}"/>
</head>
<body>

<nav class="alm-topbar">
    <div class="alm-topbar-left">
        <button class="alm-menu-btn" onclick="toggleMobileMenu()">
            <i class="bi bi-list"></i>
        </button>
        <img th:src="@{/img/Intecsa-logo.webp}" alt="Logo" class="alm-topbar-logo"/>
        <div class="alm-topbar-brand">
            <span class="alm-brand-name">INTECSA IND S.A.C.</span>
            <span class="alm-brand-sub">Almacén</span>
        </div>
    </div>
    <div class="alm-topbar-right">
        <div class="alm-notif">
            <i class="bi bi-bell"></i>
        </div>
        <div class="alm-user-chip">
            <div class="alm-user-avatar">
                <i class="bi bi-person-fill"></i>
            </div>
            <div class="alm-user-info">
                <span class="alm-user-name" sec:authentication="name">Usuario</span>
                <span class="alm-user-role">Almacenero</span>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit" class="alm-logout-btn" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right"></i>
        </button>
        </form>
        
    </div>
</nav>

<div class="alm-wrapper">

    <aside class="alm-sidebar" id="almSidebar">
        <nav class="alm-nav">

            <div class="alm-nav-label">Principal</div>

            <a th:href="@{/almacenero/dashboard}"
               class="alm-nav-item"
               th:classappend="${#strings.contains(requestURI, '/dashboard')} ? 'active' : ''">
                <div class="alm-nav-icon">
                    <i class="bi bi-speedometer2"></i>
                </div>
                <span>Inicio</span>
            </a>

            <div class="alm-nav-label">Inventario</div>

            <a th:href="@{/almacenero/inventario}"
               class="alm-nav-item"
               th:classappend="${#strings.contains(requestURI, '/inventario')} ? 'active' : ''">
                <div class="alm-nav-icon">
                    <i class="bi bi-box-seam"></i>
                </div>
                <span>Ver Inventario</span>
            </a>

            <div class="alm-nav-label">Movimientos</div>

            <a th:href="@{/almacenero/movimientos/nuevo}"
               class="alm-nav-item"
               th:classappend="${#strings.contains(requestURI, '/nuevo')} ? 'active' : ''">
                <div class="alm-nav-icon">
                    <i class="bi bi-plus-circle"></i>
                </div>
                <span>Registrar Movimiento</span>
            </a>

            <a th:href="@{/almacenero/movimientos}"
               class="alm-nav-item"
               th:classappend="${#strings.contains(requestURI, '/movimientos') and !#strings.contains(requestURI, '/nuevo')} ? 'active' : ''">
                <div class="alm-nav-icon">
                    <i class="bi bi-clock-history"></i>
                </div>
                <span>Mi Historial</span>
            </a>

        </nav>
    </aside>

    <main class="alm-main">

        <div class="alm-page-header">
            <div class="alm-page-title" layout:fragment="page-title">Inicio</div>
        </div>

        <div th:if="${mensaje}" class="alert-flash alert-flash-success">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensaje}"></span>
        </div>
        <div th:if="${error}" class="alert-flash alert-flash-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <div layout:fragment="content"></div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleMobileMenu() {
        document.getElementById('almSidebar').classList.toggle('open');
    }
</script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>

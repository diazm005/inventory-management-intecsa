<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{almacenero/layout}">

<head>
    <title>Mi Historial</title>
</head>

<body>

<th:block layout:fragment="page-title">
    <i class="bi bi-clock-history me-2"></i>Mi Historial de Movimientos
</th:block>

<div layout:fragment="content">

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
            <div class="alm-stat-card">
                <div class="alm-stat-icon alm-icon-teal">
                    <i class="bi bi-arrow-left-right"></i>
                </div>
                <div>
                    <div class="alm-stat-value"
                         th:text="${movimientos.size()}">0</div>
                    <div class="alm-stat-label">Total Movimientos</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4">
            <div class="alm-stat-card">
                <div class="alm-stat-icon alm-icon-green">
                    <i class="bi bi-arrow-down-circle"></i>
                </div>
                <div>
                    
                    <div class="alm-stat-value" th:text="${totalEntradas}">0</div>
                    <div class="alm-stat-label">Entradas</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4">
            <div class="alm-stat-card">
                <div class="alm-stat-icon alm-icon-red">
                    <i class="bi bi-arrow-up-circle"></i>
                </div>
                <div>
                   
                    <div class="alm-stat-value" th:text="${totalSalidas}">0</div>
                    <div class="alm-stat-label">Salidas</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-12 col-md-6">
            <div class="alm-search-box">
                <i class="bi bi-search"></i>
                <input type="text" id="buscadorHist"
                       placeholder="Buscar herramienta o motivo..."
                       oninput="filtrarHistorial()"/>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <select id="filtroTipoHist" class="form-select"
                    onchange="filtrarHistorial()">
                <option value="">Todos los tipos</option>
                <option value="ENTRADA">ENTRADA</option>
                <option value="SALIDA">SALIDA</option>
            </select>
        </div>
        <div class="col-6 col-md-3">
            <button class="alm-btn-outline w-100"
                    onclick="limpiarFiltrosHist()">
                <i class="bi bi-x-lg me-1"></i>Limpiar
            </button>
        </div>
    </div>

    <div class="alm-table-card">
        <div class="alm-table-header">
            <span class="alm-table-title">
                <i class="bi bi-list-ul me-2"></i>
                Mis Movimientos
                <span class="badge ms-2"
                      style="background:#f0fdfa;color:#0f766e;"
                      th:text="${movimientos.size()}">0</span>
            </span>
            <a th:href="@{/almacenero/movimientos/nuevo}"
               class="alm-btn-primary"
               style="padding:.4rem .9rem;font-size:.85rem;">
                <i class="bi bi-plus-lg"></i> Nuevo
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Herramienta</th>
                        <th>Tipo</th>
                        <th>Cantidad</th>
                        <th>Motivo</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="tbodyHistorial">
                    <tr th:each="m, i : ${movimientos}">
                        <td class="text-muted small" th:text="${i.count}">1</td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="alm-tool-icon">
                                    <i class="bi bi-wrench"></i>
                                </div>
                                <div>
                                    <div class="fw-600 small"
                                         th:text="${m.herramienta.nombre}">-</div>
                                    <span class="alm-codigo"
                                          th:text="${m.herramienta.codigo}">-</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="alm-badge"
                                  th:classappend="${m.tipo == 'ENTRADA'} ? 'alm-badge-entrada' : 'alm-badge-salida'">
                                <i class="bi"
                                   th:classappend="${m.tipo == 'ENTRADA'} ? 'bi-arrow-down-circle' : 'bi-arrow-up-circle'"></i>
                                <span th:text="${m.tipo}">-</span>
                            </span>
                        </td>
                        <td>
                            <span class="hist-cantidad"
                                  th:classappend="${m.tipo == 'ENTRADA'} ? 'hist-entrada' : 'hist-salida'"
                                  th:text="${m.tipo == 'ENTRADA'} ? '+' + ${m.cantidad} : '-' + ${m.cantidad}">
                                0
                            </span>
                        </td>
                        <td class="small text-muted"
                            th:text="${m.motivo != null ? m.motivo : '—'}">—</td>
                        <td>
                            <div class="hist-fecha">
                                <span th:text="${#temporals.format(m.fecha,'dd/MM/yyyy')}">-</span>
                                <span class="hist-hora"
                                      th:text="${#temporals.format(m.fecha,'HH:mm')}">-</span>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(movimientos)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                            Aún no tienes movimientos registrados
                            <div class="mt-3">
                                <a th:href="@{/almacenero/movimientos/nuevo}"
                                   class="alm-btn-primary">
                                    <i class="bi bi-plus-lg"></i>
                                    Registrar primer movimiento
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/historial-alm.js}"></script>
</th:block>

</body>
</html>

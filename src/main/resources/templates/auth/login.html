<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inventario | Iniciar Sesión</title>
    <link rel="icon" th:href="@{/img/Intecsa-logo.webp}"/>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- CSS propio -->
    <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>

<!-- antes de </body> -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
<body>

<div class="login-wrapper">

    <!-- PANEL IZQUIERDO - imagen de fondo -->
    <div class="login-left">
        <div class="login-left-overlay">
            <div class="login-left-content">
                <img th:src="@{/img/Intecsa-logo.webp}" alt="Logo" class="login-logo-big"/>
                <h1 class="login-empresa">INTECSA S.A.C</h1>
                <p class="login-slogan">Sistema de Gestión de Inventario de Herramientas</p>
                <div class="login-stats">
                    <div class="stat-item">
                        <i class="bi bi-tools"></i>
                        <span>Control total</span>
                    </div>
                    <div class="stat-item">
                        <i class="bi bi-graph-up"></i>
                        <span>Reportes en tiempo real</span>
                    </div>
                    <div class="stat-item">
                        <i class="bi bi-shield-check"></i>
                        <span>Acceso seguro por roles</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL DERECHO - formulario -->
    <div class="login-right">
        <div class="login-box">

            <!-- Logo pequeño mobile -->
            <div class="login-logo-mobile">
                <img th:src="@{/img/logo.png}" alt="Logo"/>
            </div>

            <div class="login-header">
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <!-- Alerta error -->
            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>Usuario o contraseña incorrectos</span>
            </div>

            <!-- Alerta logout -->
            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span>Sesión cerrada correctamente</span>
            </div>

            <!-- Formulario -->
            <form th:action="@{/login}" method="post" class="login-form">

                <div class="form-floating mb-3">
                    <input type="text"
                           class="form-control"
                           id="username"
                           name="username"
                           placeholder="Usuario"
                           required autofocus/>
                    <label for="username">
                        <i class="bi bi-person me-1"></i> Usuario
                    </label>
                </div>

                <div class="form-floating mb-4 position-relative">
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Contraseña"
                           required/>
                    <label for="password">
                        <i class="bi bi-lock me-1"></i> Contraseña
                    </label>
                    
                    <button type="button"
                            class="btn-toggle-pass"
                            onclick="togglePassword()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Ingresar
                </button>

            </form>

            <div class="login-footer">
                <small>© 2025 Intecsa S.A.C — Todos los derechos reservados</small>
            </div>

        </div>
    </div>

</div>
</body>
</html>

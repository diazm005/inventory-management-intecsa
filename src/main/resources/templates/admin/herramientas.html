<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<head>
    <title>Herramientas</title>
</head>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/herramientas.js}"></script>
</th:block>
<body>

<th:block layout:fragment="page-title">Gestión de Herramientas</th:block>

<div layout:fragment="content">

    
    <div class="page-header">
        <div>
            <h5 class="page-title-text">
                <i class="bi bi-tools me-2 text-primary"></i>Herramientas
            </h5>
            <p class="page-sub">Gestiona el inventario completo de herramientas</p>
        </div>
        <button class="btn-primary-custom" data-bs-toggle="modal" data-bs-target="#modalHerramienta"
                onclick="limpiarModal()">
            <i class="bi bi-plus-lg"></i> Nueva Herramienta
        </button>
    </div>

  
    <div class="filter-bar mb-3">
        <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" id="buscador" placeholder="Buscar herramienta..."
                   oninput="filtrarTabla()"/>
        </div>
        <select id="filtroCategoria" class="form-select filter-select"
                onchange="filtrarTabla()">
            <option value="">Todas las categorías</option>
            <option>Llaves</option>
            <option>Percusión</option>
            <option>Alicates</option>
            <option>Manual</option>
            <option>Medición</option>
            <option>Eléctrico</option>
            <option>Corte</option>
            <option>Herramientas Especiales</option>
            <option>Izaje</option>
            <option>Transporte</option>
            <option>Limpieza</option>
            <option>EPP</option>
        </select>
        <select id="filtroEstado" class="form-select filter-select"
                onchange="filtrarTabla()">
            <option value="">Todos los estados</option>
            <option>DISPONIBLE</option>
            <option>AGOTADO</option>
            <option>MANTENIMIENTO</option>
        </select>
    </div>

    <div class="table-card">
        <div class="table-card-header">
            <span class="table-card-title">
                <i class="bi bi-list-ul me-2"></i>
                Lista de Herramientas
                <span class="badge bg-primary ms-2" th:text="${herramientas.size()}">0</span>
            </span>
            <div class="d-flex gap-2">
                <a th:href="@{/reports/herramientas/excel}" class="btn-outline-report">
                    <i class="bi bi-file-earmark-excel"></i> Excel
                </a>
                <a th:href="@{/reports/herramientas/pdf}" class="btn-outline-report">
                    <i class="bi bi-file-earmark-pdf"></i> PDF
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover" id="tablaHerramientas">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Stock Actual</th>
                        <th>Stock Mínimo</th>
                        <th>Estado</th>
                        <th>Ubicación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyHerramientas">
                    <tr th:each="h, i : ${herramientas}">
                        <td th:text="${i.count}">1</td>
                        <td>
                            <span class="codigo-badge" th:text="${h.codigo}">-</span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="tool-icon-sm">
                                    <i class="bi bi-wrench"></i>
                                </div>
                                <div>
                                    <div class="fw-600" th:text="${h.nombre}">-</div>
                                    <div class="text-muted small" th:text="${h.descripcion}">-</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="categoria-badge" th:text="${h.categoria}">-</span>
                        </td>
                        <td>
                            <div class="stock-display"
                                 th:classappend="${h.stockActual <= h.stockMinimo} ? 'stock-low' : 'stock-ok'">
                                <span th:text="${h.stockActual}">0</span>
                                <div class="stock-bar-wrap">
                                    <div class="stock-bar"
                                         th:style="'width:' + ${h.stockActual > 0 ? (h.stockActual * 100 / (h.stockActual + 10)) : 0} + '%'"
                                         th:classappend="${h.stockActual <= h.stockMinimo} ? 'bar-low' : 'bar-ok'">
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${h.stockMinimo}">0</td>
                        <td>
                            <span class="badge-estado"
                                  th:classappend="${h.estado == 'DISPONIBLE'} ? 'badge-disponible' :
                                                  (${h.estado == 'AGOTADO'} ? 'badge-agotado' : 'badge-mantenimiento')"
                                  th:text="${h.estado}">-</span>
                        </td>
                        <td th:text="${h.ubicacion}">-</td>
                        <td>
                            <div class="d-flex gap-1">
                            <a class="btn-icon btn-icon-edit btn-editar-herramienta"
                            title="Editar"
                            th:data-id="${h.id}"
                            th:data-codigo="${h.codigo}"
                            th:data-nombre="${h.nombre}"
                            th:data-descripcion="${h.descripcion}"
                            th:data-categoria="${h.categoria}"
                            th:data-stockactual="${h.stockActual}"
                            th:data-stockminimo="${h.stockMinimo}"
                            th:data-estado="${h.estado}"
                            th:data-ubicacion="${h.ubicacion}">
                            <i class="bi bi-pencil"></i>
                            </a>
                                <a class="btn-icon btn-icon-delete"
                                   title="Eliminar"
                                   th:href="@{/admin/herramientas/eliminar/{id}(id=${h.id})}"
                                   onclick="return confirm('¿Eliminar esta herramienta?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(herramientas)}">
                        <td colspan="9" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                            No hay herramientas registradas
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalHerramienta" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content modal-custom">

                <div class="modal-header-custom">
                    <h5 class="modal-title-custom" id="modalTitulo">
                        <i class="bi bi-tools me-2"></i>Nueva Herramienta
                    </h5>
                    <button type="button" class="btn-close-custom"
                            data-bs-dismiss="modal">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <form th:action="@{/admin/herramientas/guardar}" method="post">
                    <input type="hidden" id="hId" name="id"/>

                    <div class="modal-body-custom">
                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Código *</label>
                                <input type="text" class="form-control"
                                       id="hCodigo" name="codigo"
                                       placeholder="Ej: HER-001" required/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Nombre *</label>
                                <input type="text" class="form-control"
                                       id="hNombre" name="nombre"
                                       placeholder="Nombre de la herramienta" required/>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Descripción</label>
                                <input type="text" class="form-control"
                                       id="hDescripcion" name="descripcion"
                                       placeholder="Descripción breve"/>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Categoría *</label>
                                <select class="form-select" id="hCategoria"
                                        name="categoria" required>
                                    <option value="">Seleccionar...</option>
                                    <option>Llaves</option>
                                    <option>Percusión</option>
                                    <option>Alicates</option>
                                    <option>Manual</option>
                                    <option>Medición</option>
                                    <option>Eléctrico</option>
                                    <option>Corte</option>
                                    <option>Herramientas Especiales</option>
                                    <option>Izaje</option>
                                    <option>Transporte</option>
                                    <option>Limpieza</option>
                                    <option>EPP</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Ubicación</label>
                                <input type="text" class="form-control"
                                       id="hUbicacion" name="ubicacion"
                                       placeholder="Ej: Estante A1"/>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Stock Actual *</label>
                                <input type="number" class="form-control"
                                       id="hStockActual" name="stockActual"
                                       min="0" required/>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Stock Mínimo *</label>
                                <input type="number" class="form-control"
                                       id="hStockMinimo" name="stockMinimo"
                                       min="0" required/>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Estado *</label>
                                <select class="form-select" id="hEstado"
                                        name="estado" required>
                                    <option value="DISPONIBLE">DISPONIBLE</option>
                                    <option value="AGOTADO">AGOTADO</option>
                                    <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                                </select>
                            </div>

                        </div>
                    </div>

                    <div class="modal-footer-custom">
                        <button type="button" class="btn-cancel"
                                data-bs-dismiss="modal">
                            <i class="bi bi-x me-1"></i>Cancelar
                        </button>
                        <button type="submit" class="btn-primary-custom">
                            <i class="bi bi-check-lg me-1"></i>Guardar
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE | Inventario Admin">Admin</title>
    <link rel="icon" th:href="@{/img/favicon.ico}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>

<div class="sidebar" id="sidebar">

    <div class="sidebar-brand">
        <img th:src="@{/img/Intecsa-logo.webp}" alt="Logo" class="sidebar-logo"/>
        <div class="sidebar-brand-text">
            <span class="brand-name">INTECSA</span>
            <span class="brand-sub">Panel Admin</span>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>

        <a th:href="@{/admin/dashboard}"
           class="nav-item"
           th:classappend="${#strings.contains(requestURI, '/dashboard')} ? 'active' : ''">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>

        <div class="nav-section-label">Gestión</div>

        <a th:href="@{/admin/herramientas}"
           class="nav-item"
           th:classappend="${#strings.contains(requestURI, '/herramientas')} ? 'active' : ''">
            <i class="bi bi-tools"></i>
            <span>Herramientas</span>
        </a>

        <a th:href="@{/admin/usuarios}"
           class="nav-item"
           th:classappend="${#strings.contains(requestURI, '/usuarios')} ? 'active' : ''">
            <i class="bi bi-people"></i>
            <span>Usuarios</span>
        </a>

        <a th:href="@{/admin/movimientos}"
           class="nav-item"
           th:classappend="${#strings.contains(requestURI, '/movimientos')} ? 'active' : ''">
            <i class="bi bi-arrow-left-right"></i>
            <span>Movimientos</span>
        </a>

        <div class="nav-section-label">Reportes</div>

        <a th:href="@{/reports/herramientas/excel}" class="nav-item">
            <i class="bi bi-file-earmark-excel"></i>
            <span>Excel Herramientas</span>
        </a>

        <a th:href="@{/reports/movimientos/excel}" class="nav-item">
            <i class="bi bi-file-earmark-excel"></i>
            <span>Excel Movimientos</span>
        </a>

        <a th:href="@{/reports/herramientas/pdf}" class="nav-item">
            <i class="bi bi-file-earmark-pdf"></i>
            <span>PDF Inventario</span>
        </a>
    </nav>

    <div class="sidebar-user">
        <div class="user-avatar">
            <i class="bi bi-person-circle"></i>
        </div>
        <div class="user-info">
            <span class="user-name" sec:authentication="name">Admin</span>
            <span class="user-role">Administrador</span>
        </div>
        <form th:action="@{/logout}" method="post" style="display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn-logout" title="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
        </button>
</form>
    </div>
</div>

<div class="main-content" id="mainContent">

    <div class="topbar">
        <button class="btn-toggle-sidebar" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title" layout:fragment="page-title">Inicio</div>
        <div class="topbar-right">
            <div class="topbar-badge">
                <i class="bi bi-bell"></i>
            </div>
            <div class="topbar-user">
                <i class="bi bi-person-circle me-1"></i>
                <span sec:authentication="name">Admin</span>
            </div>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert-flash alert-flash-success">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensaje}"></span>
    </div>
    <div th:if="${error}" class="alert-flash alert-flash-danger">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="page-content" layout:fragment="content">
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
        document.getElementById('mainContent').classList.toggle('expanded');
    }
</script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
